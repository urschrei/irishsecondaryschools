<!doctype html>
<html lang="en-IE">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Irish schools map</title>
    <meta
      name="description"
      content="Map of the primary and post-primary schools aided by the Department of Education, with enrolment, area deprivation and distance to the nearest school."
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body class="font-sans text-ink antialiased">
    <a
      href="#panel"
      class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-50 focus:bg-white focus:px-3 focus:py-2"
      >Skip to the school list</a
    >
    <div
      class="grid h-dvh grid-rows-[45dvh_minmax(0,1fr)] md:grid-cols-[26rem_minmax(0,1fr)] md:grid-rows-1"
    >
      <main
        id="panel"
        tabindex="-1"
        class="order-2 overflow-y-auto border-rule bg-panel md:order-1 md:border-r"
      >
        <header class="border-b border-rule px-5 pt-5 pb-4">
          <h1 class="text-2xl font-bold">Irish schools</h1>
          <p class="mt-1 text-sm text-muted">
            Schools aided by the Department of Education,
            <span data-school-year>2025/26</span>.
            <a class="text-sign underline underline-offset-2" href="downloads.html"
              >Download the data</a
            >
          </p>
        </header>
        <section class="border-b border-rule px-5 py-4">
          <form role="search" id="search-form">
            <label for="search" class="block font-bold">Find a school</label>
            <p id="search-hint" class="text-sm text-muted">
              Name, address, roll number, Eircode, or Eircode area such as D07
            </p>
            <input
              id="search"
              type="search"
              autocomplete="off"
              aria-describedby="search-hint"
              class="mt-2 w-full rounded border border-rule bg-white px-3 py-2"
            />
          </form>
        </section>
        <details id="filters" class="border-b border-rule">
          <summary class="cursor-pointer px-5 py-3 font-bold">
            Filters <span id="filter-count" class="font-normal text-muted"></span>
          </summary>
          <form id="filter-form" class="space-y-4 px-5 pt-1 pb-5"></form>
        </details>
        <section id="results" aria-labelledby="results-heading">
          <div class="flex items-baseline justify-between gap-3 px-5 pt-4">
            <h2 id="results-heading" class="text-lg font-bold">Schools</h2>
            <p id="status" class="text-sm text-muted" role="status">Loading schools</p>
          </div>
          <ol id="result-list" class="mt-2 divide-y divide-rule border-y border-rule"></ol>
          <div class="px-5 py-4">
            <button
              id="show-more"
              type="button"
              class="rounded border border-sign px-3 py-1.5 text-sign hover:bg-white"
              hidden
            ></button>
          </div>
        </section>
      </main>
      <div class="relative order-1 md:order-2">
        <div id="map" class="h-full w-full" role="region" aria-label="Map of schools"></div>
        <details
          id="legend"
          class="absolute bottom-9 left-2 z-10 w-72 max-w-[calc(100%-1rem)] rounded-md border border-rule bg-white/95 text-sm shadow-sm"
        >
          <summary class="cursor-pointer px-3 py-2 font-bold">Key</summary>
          <div class="space-y-2 px-3 pb-3">
            <label for="colour-mode" class="block text-muted">Colour by</label>
            <select
              id="colour-mode"
              class="w-full rounded border border-rule bg-white px-2 py-1.5"
            ></select>
            <ul id="legend-classes" class="space-y-1"></ul>
            <p id="legend-note" class="text-xs text-muted" hidden></p>
            <label class="flex items-center gap-2 pt-1">
              <input id="size-mode" type="checkbox" class="size-4 accent-sign" />
              Size by enrolment
            </label>
          </div>
        </details>
      </div>
    </div>
  </body>
</html>
