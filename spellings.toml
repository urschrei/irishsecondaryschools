# Spellings of words in school names.
#
# The Department lists often do not have accents and apostrophes, and
# some names have incorrect accents. The build applies these tables to
# the name of each school in each year, after it gives the name a
# standard capitalisation (see src/irish_schools/names.py).
#
# The keys are words in lower case without accents or apostrophes.

